# Cloudflare Pages settings for key-sailing-site.
# Bindings and plain variables live here (this file wins over the dashboard).
# Secrets are NOT here; set them in the dashboard (Settings > Variables and Secrets):
#   RESEND_API_KEY, TURNSTILE_SECRET_KEY, TEST_TO
name = "key-sailing-site"
pages_build_output_dir = "."
compatibility_date = "2026-09-01"

[vars]
SITE = "key-sailing"
SITE_NAME = "Key Sailing website"
MAIL_FROM = "Key Sailing website <website@siestakeysailing.com>"
LIVE_TO = "siestakeysailing@gmail.com"
# Gets a copy of every form once it's live (Donna, who helps Jan with the schedule; Jan's wish 12 Oct 2026)
LIVE_CC = "donna.mason@me.com"
# "true" since launch (12 Oct 2026): forms go to LIVE_TO + LIVE_CC. "false" sends them to TEST_TO instead.
FORMS_LIVE = "true"

# Site editor (/admin/, functions/api/admin/[[path]].js). Secret GITHUB_TOKEN is in the dashboard.
GITHUB_REPO = "ZorroNielsen/key-sailing-site"
GITHUB_BRANCH = "main"
EDITORS = "siestakeysailing@gmail.com,websitesbychris.co@gmail.com,adam.kriz.333@gmail.com"
# Cloudflare Access login for /admin and /api/admin: team domain + the applications' audience tags
# (comma-separated; Zero Trust → Access → Applications → the app → Overview → Application Audience Tag)
ACCESS_TEAM = "keysailing.cloudflareaccess.com"
ACCESS_AUD = "b1e3078be2dbd8f14c274eb9507a3e8af6bafd471e3200081619b8b1afc64f4a,4fcc63c0f4f8bbb4762115d60fa6cd93dff6c6c87eb3b7f428a9902472bb7944"

[[d1_databases]]
binding = "DB"
database_name = "sarasota-sites"
database_id = "e144b4ea-d510-4703-9707-21e78cbcc27a"
